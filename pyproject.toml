[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "furrow-smart-agri"
version = "1.0.0"
description = "FURROW: freshness- and uncertainty-aware retrieval with reservation-based online workload scheduling for cloud-enabled smart agriculture"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Sneha"}, {name = "Prabh Deep Singh"}, {name = "Vikas Tripathi"}]
dependencies = ["numpy>=2.0", "pandas>=2.2", "scipy>=1.12", "pyarrow>=15", "pyyaml>=6.0", "matplotlib>=3.8", "rdata>=0.11"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
